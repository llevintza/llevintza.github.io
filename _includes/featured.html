<div class="cards">
{%- for p in site.data.featured -%}
  <article class="card">
    <h3>
      {%- if p.repo -%}<a href="{{ p.repo }}">{{ p.name }}</a>{%- else -%}{{ p.name }} <span class="tag">private</span>{%- endif -%}
    </h3>
    <p>{{ p.description }}</p>
    <p class="stack">{{ p.stack | join: " · " }}</p>
    <p class="links">
      {%- if p.site -%}<a href="{{ p.site }}">Live site</a> · {% endif -%}
      {%- if p.repo -%}<a href="{{ p.repo }}">Source</a>{%- else -%}Source on request{%- endif -%}
    </p>
  </article>
{%- endfor -%}
</div>
