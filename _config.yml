title: Leo Levintza
description: >-
  Principal Software Engineer · Distributed Systems · Cloud-Native Backends ·
  Agentic AI Tooling & AI-Augmented SDLC · New York Metro Area
url: "https://llevintza.github.io"
baseurl: ""
author:
  name: Leo Levintza

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Top navigation, in this order.
header_pages:
  - blog.md
  - projects.md
  - about.md

# Contact links: icons come from the email-icons repo (colored 64px set).
icons_base: "https://llevintza.github.io/email-icons/img/color/"
contacts:
  - label: LinkedIn
    url: "https://www.linkedin.com/in/llevintza/"
    icon: linkedin.png
  - label: GitHub
    url: "https://github.com/llevintza"
    icon: github.png
  - label: X
    url: "https://x.com/llevintza"
    icon: x.png
  - label: Book a Zoom call
    url: "https://scheduler.zoom.us/llevintza/availability"
    icon: zoom.png

# "All public repos" list on /projects/: every public, non-fork, non-archived repo
# (from GitHub metadata at build time) except these.
repo_exclude:
  - llevintza
  - llevintza.github.io
  - instrument-price-dashboard-access
  - OSSRH-88897

permalink: /blog/:year/:month/:day/:title/
show_excerpts: true

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  # Next.js rebuild and Node tooling: not part of the Jekyll site.
  - web/
  - design/
  - docs/
  - node_modules/
  - package.json
  - pnpm-lock.yaml
  - commitlint.config.mjs
  - .husky/
  - CONTRIBUTING.md
