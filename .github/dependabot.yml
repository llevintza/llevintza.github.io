# Dependabot version updates (#64).
#
# Commit messages and PR titles must pass the required Conventional Commits
# checks (commitlint + amannn/action-semantic-pull-request). An explicit
# prefix gives "chore(deps): bump x from a to b" and "ci(deps): bump …":
# Dependabot appends ": " after a prefix that ends in ")", and keeps "bump"
# lower case because the prefix and this repo's history are lower case.
#
# Runs weekly on Monday at 03:00 UTC, ahead of the 04:17 UTC rebuild cron
# in deploy.yml. Every version update is batched: each ecosystem gets at most
# two PRs a week, one for minor + patch and one for majors, so a breaking
# major can't hold back the routine updates. Security updates aren't grouped.
#
# web-mermaid: any mermaid bump (patch included) changes every diagram hash,
# and mermaid must match mermaid-isomorphic. So both move together in their
# own PR, which needs a local re-render (`pnpm build`, see web/README.md
# "Mermaid diagrams") before CI goes green. It never blocks the other batches.
#
# cooldown: pnpm 12 refuses versions younger than its minimumReleaseAge
# (default 1440 minutes, one day), so Dependabot must not propose anything
# newer. Three days covers that with a margin; majors wait a week.
version: 2

updates:
  # Not covered on purpose: design/ (mockup screenshot tooling). It doesn't
  # ship to the site.

  # Root tooling: commitlint and husky (pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Etc/UTC
    commit-message:
      prefix: chore(deps)
    groups:
      root-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      root-major:
        patterns: ["*"]
        update-types: [major]
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 5

  # Next.js app (web/pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Etc/UTC
    commit-message:
      prefix: chore(deps)
    groups:
      web-mermaid:
        patterns: [mermaid, mermaid-isomorphic]
      web-minor-patch:
        patterns: ["*"]
        exclude-patterns: [mermaid, mermaid-isomorphic]
        update-types: [minor, patch]
      web-major:
        patterns: ["*"]
        exclude-patterns: [mermaid, mermaid-isomorphic]
        update-types: [major]
    # Versions the toolchain can't take yet (#101, A101-01/02/03). These are
    # version-range ignores, so security fixes within the current majors are
    # unaffected. Remove each one once its cause is gone.
    ignore:
      # Tied to the Node runtime major in web/.nvmrc (22). Raise this bound in
      # the same PR that bumps .nvmrc, engines.node and CI, never ahead.
      - dependency-name: "@types/node"
        versions: [">=23"]
      # typescript-eslint 8.72.1 caps its peer range at typescript <6.1.0.
      # Remove once typescript-eslint widens it.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # eslint-plugin-react 7.37.5, eslint-plugin-jsx-a11y 6.10.2 and
      # eslint-plugin-import 2.32.0 (via eslint-config-next 16.4.5) cap their
      # peer eslint at ^9. Remove when eslint-config-next supports ESLint 10.
      - dependency-name: eslint
        versions: [">=10"]
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 5

  # Workflow actions. They are pinned to full commit SHAs with a "# vX.Y.Z"
  # comment, and Dependabot updates the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Etc/UTC
    commit-message:
      prefix: ci(deps)
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-major:
        patterns: ["*"]
        update-types: [major]
    # github-actions supports only default-days (no semver-*-days).
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
