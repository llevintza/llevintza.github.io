name: Links

# Checks every link in the Next.js static export (web/out) and the icon URLs that
# sent email signatures load. Runs on every PR (no paths filter, so the checks
# always report), on pushes to main, weekly, and on demand.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Link check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web/
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # lychee writes .lycheecache; results expire after a day (max_cache_age in
      # lychee.toml). A new key per run, restored from the latest previous one.
      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lychee-

      # Internal links resolve against web/out: root-relative paths via --root-dir,
      # and directory links (`/blog/`) to their index.html (index_files in lychee.toml).
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --config lychee.toml
            --root-dir ${{ github.workspace }}/web/out
            --no-progress
            'web/out/**/*.html'
          fail: true

  email-icons:
    name: Email icon URLs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/email-icon-urls.txt
          sparse-checkout-cone-mode: false

      - name: Check each icon returns 200 with an image content type
        run: |
          set -euo pipefail
          failed=0
          count=0
          while IFS= read -r url; do
            case "$url" in ''|'#'*) continue ;; esac
            count=$((count + 1))
            if ! out=$(curl -sS -o /dev/null -L --retry 3 --retry-all-errors --max-time 20 \
                -w '%{http_code} %{content_type}' "$url"); then
              out="curl-error"
            fi
            code=${out%% *}
            type=${out#* }
            if [ "$code" = "200" ] && [[ "$type" == image/* ]]; then
              echo "ok    $code $type $url"
            else
              echo "::error::$url -> $out"
              failed=$((failed + 1))
            fi
          done < .github/email-icon-urls.txt
          echo "$count icon URLs checked, $failed failed."
          echo "$count email icon URLs checked, $failed failed." >> "$GITHUB_STEP_SUMMARY"
          [ "$count" -gt 0 ] || { echo "::error::No URLs found in .github/email-icon-urls.txt"; exit 1; }
          [ "$failed" -eq 0 ]

  # On a failed weekly run, open one tracking issue, or comment on it if it's
  # already open. Only this job can write issues.
  report:
    name: Report broken links
    needs: [links, email-icons]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Broken links detected
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      LINKS_RESULT: ${{ needs.links.result }}
      ICONS_RESULT: ${{ needs.email-icons.result }}
    steps:
      - name: Open or update the issue
        run: |
          set -euo pipefail
          body=$(printf 'The weekly link check failed on %s.\n\n- Link check: %s\n- Email icon URLs: %s\n\nDetails: %s\n' \
            "$(date -u +%Y-%m-%d)" "$LINKS_RESULT" "$ICONS_RESULT" "$RUN_URL")
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
