name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    # Required check on main: keep this name stable.
    name: 'Web: lint, typecheck, build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The job always runs, so the required check always reports. When web/
      # (and this workflow) are unchanged, the heavy steps are skipped and the
      # job still succeeds.
      - name: Detect web/ changes
        id: changes
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE...$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -qE '^0+$'; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            echo "No usable diff base; running everything."
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed="$(git diff --name-only "$range")"; then
            echo "Could not diff $range; running everything."
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qE '^(web/|\.github/workflows/ci\.yml$)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web/ unchanged in $range; skipping lint, typecheck and build."
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.changes.outputs.web == 'true'
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.web == 'true'
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Cache Next.js build cache
        if: steps.changes.outputs.web == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}-${{ hashFiles('web/**/*.ts', 'web/**/*.tsx', 'web/**/*.mdx', 'web/**/*.css') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}-

      - name: Install
        if: steps.changes.outputs.web == 'true'
        run: pnpm install --frozen-lockfile

      - name: Format check
        if: steps.changes.outputs.web == 'true'
        run: pnpm format:check

      - name: Lint
        if: steps.changes.outputs.web == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.changes.outputs.web == 'true'
        run: pnpm typecheck

      - name: Contrast
        if: steps.changes.outputs.web == 'true'
        run: pnpm check:contrast

      - name: Test
        if: steps.changes.outputs.web == 'true'
        run: pnpm test

      - name: Build
        if: steps.changes.outputs.web == 'true'
        run: pnpm build
