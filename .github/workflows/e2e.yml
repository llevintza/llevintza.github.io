name: E2E

# Playwright smoke tests and per-PR UX screenshots for the Next.js app in web/.
# See web/e2e/README.md. Not a required check.

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    outputs:
      screenshots: ${{ steps.ux.outcome }}
      artifact-url: ${{ steps.upload-shots.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build static export
        run: pnpm build
        env:
          # Build /projects/ from the committed repo cache, not the live
          # GitHub API, so the run is hermetic (#22).
          REPOS_OFFLINE: "1"

      - name: Smoke tests
        run: pnpm test:e2e
        env:
          PW_SKIP_BUILD: "1"

      - name: UX screenshots
        id: ux
        if: ${{ !cancelled() }}
        run: pnpm ux:screenshots
        env:
          PW_SKIP_BUILD: "1"

      - name: Upload UX screenshots
        id: upload-shots
        if: ${{ !cancelled() && steps.ux.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ux-screenshots
          path: web/ux-screenshots/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  publish:
    name: Publish UX screenshots
    needs: test
    # Runs even when the smoke tests fail, as long as screenshots were taken.
    # Fork and Dependabot PRs get a read-only token, so they keep the
    # artifact only.
    if: >-
      ${{ !cancelled() && needs.test.outputs.screenshots == 'success'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This job never runs code from the PR: it only moves PNGs and comments.
    permissions:
      contents: write
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ux-screenshots
          path: shots

      - name: Push to the ux-screenshots branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q pub
          cd pub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Other PRs push here too: on a rejected push, start over from the
          # new tip instead of rebasing.
          for attempt in 1 2 3 4 5; do
            if git fetch -q --depth 1 origin ux-screenshots; then
              git checkout -q -B ux-screenshots FETCH_HEAD
            else
              git checkout -q --orphan ux-screenshots
              git rm -rfq --ignore-unmatch .
            fi
            rm -rf "pr-${PR}"
            mkdir "pr-${PR}"
            cp ../shots/*.png "pr-${PR}/"
            git add -A "pr-${PR}"
            if git diff --cached --quiet; then
              echo "Screenshots unchanged."
              exit 0
            fi
            git commit -qm "chore(ux): screenshots for PR #${PR} at ${HEAD_SHA::7}"
            if git push -q origin HEAD:ux-screenshots; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); retrying."
            sleep $((attempt * 3))
          done
          echo "::error::Could not push to ux-screenshots after 5 attempts."
          exit 1

      - name: Upsert the sticky PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_URL: ${{ needs.test.outputs.artifact-url }}
        with:
          script: |
            const fs = require("node:fs");
            const { owner, repo } = context.repo;
            const pr = Number(process.env.PR);
            const sha = process.env.HEAD_SHA;
            const marker = "[UX Screenshots]";

            // <route-slug>-<project>-<theme>.png
            const shots = {};
            for (const file of fs.readdirSync("shots").sort()) {
              const m = file.match(/^(.+)-(desktop|phone)-(light|dark)\.png$/);
              if (!m) continue;
              const [, route, project, theme] = m;
              (shots[route] ??= {})[`${project}-${theme}`] = file;
            }

            const base = `https://github.com/${owner}/${repo}/blob/ux-screenshots/pr-${pr}`;
            const cols = [
              ["phone-dark", "Phone, dark", 180],
              ["phone-light", "Phone, light", 180],
              ["desktop-dark", "Desktop, dark", 320],
              ["desktop-light", "Desktop, light", 320],
            ];
            const cell = (file, label, width) =>
              file
                ? `<a href="${base}/${file}?raw=true"><img src="${base}/${file}?raw=true" width="${width}" alt="${label}"></a>`
                : "–";
            const rows = Object.keys(shots).map((route) => {
              const cells = cols.map(([key, label, width]) =>
                cell(shots[route][key], `${route}, ${label}`, width),
              );
              return `| \`${route}\` | ${cells.join(" | ")} |`;
            });

            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `${marker} for ${sha.slice(0, 7)}`,
              "",
              "Full-page Playwright screenshots of the production build (phone 390x844, desktop 1440x900), hermetic network, reduced motion. Click an image for full size.",
              "",
              `| Route | ${cols.map(([, label]) => label).join(" | ")} |`,
              `| --- | ${cols.map(() => "---").join(" | ")} |`,
              ...rows,
              "",
              `Artifact: [ux-screenshots](${process.env.ARTIFACT_URL || run}) · [workflow run](${run}) · files on [\`ux-screenshots/pr-${pr}/\`](https://github.com/${owner}/${repo}/tree/ux-screenshots/pr-${pr})`,
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr, per_page: 100,
            });
            // Only our own bot comment: never overwrite a human's that starts with the marker.
            const existing = comments.find(
              (c) => c.user?.login === "github-actions[bot]" && c.body?.startsWith(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }
