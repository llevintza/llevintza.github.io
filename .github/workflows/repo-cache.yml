name: Repo cache

# Weekly staleness reminder for web/content/repos.cache.json (#99). The build
# falls back to that committed cache when the GitHub API fails, at any age, so
# a repo that went private could stay linked until someone refreshes it.
#
# This workflow only reads the cache's age: no network fetch, no write to the
# repo, no PR. (PRs opened with GITHUB_TOKEN don't trigger the required checks,
# and the refresh needs no extra credential when a person runs it.) When the
# cache is older than 14 days it opens one issue, or updates the open one,
# asking for `pnpm refresh:repos` and a PR; once the cache is fresh again it
# closes that issue.
on:
  # Mondays 05:41 UTC: off-peak, a non-round minute, after the deploy.yml cron.
  # GitHub disables scheduled workflows in public repos after 60 days without
  # repository activity; re-enable with `gh workflow enable repo-cache.yml`.
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: repo-cache
  cancel-in-progress: false

jobs:
  age:
    name: Repo cache age
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Every open issue whose title starts with this, carrying both labels,
      # is "the" reminder; the title's day count changes from run to run.
      TITLE_PREFIX: "Repo cache is "
      LABELS: chore,area:projects
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            web/.nvmrc
            web/package.json
            web/content/repos.cache.json
            web/lib/projects/repos.ts
            web/scripts/refresh-repos.mjs
          sparse-checkout-cone-mode: false

      # The check imports only node: built-ins, so no pnpm install is needed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc

      - name: Check the cache age
        id: age
        working-directory: web
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/refresh-repos.mjs --check

      - name: Open, update or close the reminder issue
        env:
          AGE_DAYS: ${{ steps.age.outputs.age_days }}
          STALE: ${{ steps.age.outputs.stale }}
          FETCHED_AT: ${{ steps.age.outputs.fetched_at }}
        run: |
          set -euo pipefail
          case "$AGE_DAYS" in '' | *[!0-9-]*) echo "::error::bad age_days '$AGE_DAYS'"; exit 1 ;; esac

          # Oldest first, so a stray duplicate never takes over.
          open=$(gh issue list --state open --label chore --label area:projects \
            --limit 100 --json number,title \
            --jq 'map(select(.title | startswith(env.TITLE_PREFIX))) | sort_by(.number) | .[].number')
          first=$(printf '%s\n' "$open" | head -n 1)

          if [ "$STALE" != "true" ]; then
            echo "Cache is $AGE_DAYS days old (fetched $FETCHED_AT): fresh."
            for n in $open; do
              gh issue close "$n" --reason completed \
                --comment "The repo cache is fresh again: fetched $FETCHED_AT, $AGE_DAYS days old. Closed by $RUN_URL"
            done
            exit 0
          fi

          title="Repo cache is $AGE_DAYS days old: run pnpm refresh:repos and open a PR"
          if [ "$AGE_DAYS" -lt 0 ]; then
            title="Repo cache is dated in the future: run pnpm refresh:repos and open a PR"
          fi
          body=$(cat <<EOF
          \`web/content/repos.cache.json\` was fetched **$FETCHED_AT** ($AGE_DAYS days ago). The limit is 14 days (#99).

          The build falls back to this cache whenever the GitHub API fails, so a repo that has gone private since could still be linked on the site.

          To refresh (no token needed; \`GITHUB_TOKEN\` raises the rate limit):

          \`\`\`sh
          cd web
          pnpm refresh:repos
          \`\`\`

          Commit the cache on a \`chore/99-refresh-repo-cache\`-style branch and open a PR with the printed summary in its body. This issue closes itself on the first weekly run after the refresh lands.

          Last checked: $RUN_URL
          EOF
          )

          if [ -n "$first" ]; then
            gh issue edit "$first" --title "$title" --body "$body"
            echo "Updated #$first: $title"
          else
            # The labels may not exist yet in a fresh repo.
            gh label create chore --color c5def5 \
              --description "Maintenance with no user-facing change" 2>/dev/null || true
            gh issue create --title "$title" --body "$body" --label "$LABELS"
          fi
