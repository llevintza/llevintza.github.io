# lychee link checker config, used by .github/workflows/links.yml (job "Link check").
# Docs: https://lychee.cli.rs/usage/config/
#
# Run it locally from the repo root after `pnpm build` in web/:
#   lychee --config lychee.toml --root-dir "$PWD/web/out" 'web/out/**/*.html'
# `--root-dir` must be an absolute path, so it is passed on the command line, not here.

# Directory links such as `/blog/` resolve to `blog/index.html` (the export uses
# trailingSlash), and that file must exist.
index_files = ["index.html"]

# Reuse results between runs (CI restores `.lycheecache`) so a flaky host that was
# fine yesterday doesn't fail today's PR. Failures are never cached.
cache = true
max_cache_age = "1d"
cache_exclude_status = "400.."

# Be patient with slow or flaky hosts before calling a link broken.
max_retries = 3
retry_wait_time = 2
timeout = 20
max_concurrency = 16

# 429 means "rate limited", not "broken": don't fail a PR because GitHub or a CDN
# throttled the runner.
accept = ["100..=103", "200..=299", "429"]

# Ordinary browser user agent; some hosts reject lychee's default one.
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"

# Only web links. `mailto:` can't be verified without sending mail.
scheme = ["https", "http", "file"]

exclude_loopback = true

# Hosts that block or challenge automated clients (login walls, 999/403 to bots),
# so a check would always fail even though the link works in a browser.
exclude = [
  '^https?://([a-z]+\.)?linkedin\.com/',  # returns HTTP 999 to non-browser clients
  '^https?://(www\.)?(x|twitter)\.com/',   # login wall / 403 for bots
  '^https?://([a-z]+\.)?zoom\.us/',        # bot challenge on scheduler pages
]
