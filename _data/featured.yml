- name: instrument-price-dashboard
  private: true
  site: "https://llevintza.github.io/instrument-price-dashboard/"
  description: >-
    Dashboard over daily closing prices: a layered .NET 10 API serving price series with return,
    volatility and drawdown stats, and a React front end for search, charting and ticker comparison.
    Milestones M1-M3 shipped
  stack: [".NET 10", "React 19", "TanStack Query", "Recharts", "SignalR", "Playwright"]
  access: On request

